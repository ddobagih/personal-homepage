log_format thecistus_analytics
  '$remote_addr - $remote_user [$time_local] '
  '"$request" $status $body_bytes_sent '
  '"$http_referer" "$http_user_agent" '
  'qs="$query_string"';

upstream thecistus_app {
  server 127.0.0.1:4173;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name thecistus.com www.thecistus.com;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name thecistus.com www.thecistus.com;

  access_log /var/log/nginx/thecistus.access.log;
  error_log /var/log/nginx/thecistus.error.log;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  client_max_body_size 10m;

  location ~ /\.(?!well-known(?:/|$)) {
    return 404;
  }

  location = /healthz {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://thecistus_app/healthz;
  }

  location = /__analytics.gif {
    access_log /var/log/nginx/thecistus.analytics.log thecistus_analytics;
    add_header Cache-Control "no-store" always;
    return 204;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://thecistus_app;
  }

  ssl_certificate /etc/letsencrypt/live/thecistus.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/thecistus.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
