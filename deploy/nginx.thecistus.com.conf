log_format thecistus_analytics
  '$remote_addr - $remote_user [$time_local] '
  '"$request" $status $body_bytes_sent '
  '"$http_referer" "$http_user_agent" '
  'qs="$query_string"';

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _ thecistus.com www.thecistus.com;

  root /var/www/thecistus.com/current;
  index index.html;

  access_log /var/log/nginx/thecistus.access.log;
  error_log /var/log/nginx/thecistus.error.log;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; style-src-elem 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' https:; connect-src 'self'; frame-src 'self' https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com https://youtube-nocookie.com https://player.vimeo.com https://open.spotify.com https://codepen.io https://codesandbox.io https://docs.google.com; child-src 'self' https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com https://youtube-nocookie.com https://player.vimeo.com https://open.spotify.com https://codepen.io https://codesandbox.io https://docs.google.com; media-src 'self'; worker-src 'none'; manifest-src 'self'" always;

  location = /healthz {
    add_header Content-Type text/plain;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    return 200 "ok\n";
  }

  location = /__analytics.gif {
    access_log /var/log/nginx/thecistus.analytics.log thecistus_analytics;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    return 204;
  }

  location ~ /\.(?!well-known(?:/|$)) {
    return 404;
  }

  location ~ ^/(?:server\.js|content-store\.js|editor-draft-store\.js|notion-store\.js|notion-content\.js|admin-src|package(?:-lock)?\.json|deploy|scripts|test|data)(?:/|$) {
    return 404;
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
