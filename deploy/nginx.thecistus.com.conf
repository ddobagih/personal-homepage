log_format thecistus_analytics
  '$remote_addr - $remote_user [$time_local] '
  '"$request" $status $body_bytes_sent '
  '"$http_referer" "$http_user_agent" '
  'qs="$query_string"';

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _ thecistus.com www.thecistus.com;

  root /var/www/thecistus.com/current;
  index index.html;

  access_log /var/log/nginx/thecistus.access.log;
  error_log /var/log/nginx/thecistus.error.log;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /__analytics.gif {
    access_log /var/log/nginx/thecistus.analytics.log thecistus_analytics;
    add_header Cache-Control "no-store" always;
    return 204;
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
