          - paragraph [ref=f2e96]: 사용자가 길안내와 장애물 인지를 한 손 안에서 확인할 수 있는 시각장애인 보행 지원 PWA를 기획했습니다. 서비스 흐름, 기능 우선순위, 데이터 구조, 운영 시나리오를 포트폴리오 문서 형태로 정리한 프로젝트입니다.
        - generic [ref=f2e97]:
          - generic [ref=f2e98]: Problem
          - heading "문제 정의" [level=3] [ref=f2e99]
          - paragraph [ref=f2e101]: 보행 보조 서비스는 기능은 많아도 실제 사용 상황에서 정보가 분산되기 쉽습니다. 특히 길안내, 장애물 알림, 목적지 접근 정보가 한 흐름으로 이어지지 않으면 사용성이 빠르게 떨어집니다.
        - generic [ref=f2e102]:
          - generic [ref=f2e103]: Approach
          - heading "해결 방식" [level=3] [ref=f2e104]
          - paragraph [ref=f2e106]: 모바일 웹앱 하나에서 탐색, 음성 안내, 장애물 인지, 기록까지 연결되는 구조를 설계했습니다. 첫 화면에서 핵심 행동을 줄이고, 실제 이동 상황을 기준으로 화면 흐름을 나눴습니다.
